# Reasonix configuration for CampusLink.
# Agent instructions live in AGENTS.md. Secrets come from environment variables or .env only.

config_version = 3
default_model = "deepseek/deepseek-v4-flash"

[agent]
cold_resume_prune = true

[tools]
bash_timeout_seconds = 120

[tools.background_jobs]
stalled_warning_seconds = 900

[lsp]
enabled = true

[skills]
max_depth = 3

[permissions]
allow = [
  "task",
  "Edit",
  "explore",
  "Bash(cd /Users/zhenggangzhou/Desktop/04_CampusLink/campuslink-v2 && npx tsc --noEmit 2>&1)",
  "Bash(cd /Users/zhenggangzhou/Desktop/04_CampusLink/campuslink-v2 && npx vitest run 2>&1)",
  "Bash(cd /Users/zhenggangzhou/Desktop/04_CampusLink/campuslink-v2 && npm run build 2>&1)",
  "Bash(cd /Users/zhenggangzhou/Desktop/04_CampusLink/campuslink-v2 && git status --short)",
  "Bash(cd /Users/zhenggangzhou/Desktop/04_CampusLink/campuslink-v2 && ls logs/ 2>/dev/null | tail -10)"
]

[sandbox]
bash = "enforce"
network = true

[[providers]]
name = "deepseek-flash"
kind = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }

[[providers]]
name = "deepseek-pro"
kind = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }

[[providers]]
name = "deepseek"
kind = "openai"
base_url = "https://api.deepseek.com"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
default = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }
prices = { "deepseek-v4-flash" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }, "deepseek-v4-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }
