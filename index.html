<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4a90d9" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>四川财经职业学院 · CampusLink</title>
    <script>
      var BUILD = '20260701000010';
      var prev = localStorage.getItem('campuslink_build');
      if (prev && prev !== BUILD) {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.startsWith('campuslink_') && k !== 'campuslink_token' && k !== 'campuslink_refresh' && k !== 'campuslink_sid') keys.push(k);
        }
        keys.forEach(function(k) { localStorage.removeItem(k); });
      }
      localStorage.setItem('campuslink_build', BUILD);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
