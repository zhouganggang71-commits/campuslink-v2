# CampusLink — nginx 配置（方案B：nginx 接管 443，Apache 退到后面）
#
# ── 已部署在阿里云服务器（8.156.64.189）──
#
# 进程视角:
# ├── nginx   → :443  (CampusLink /campus/ → FRP:8082 → N100:3002)
# │               (WordPress / → Apache:8081)
# ├── nginx   → :8443 (同上，向后兼容)
# ├── nginx   → :80   (HTTP → Apache:8081)
# ├── Apache  → :8081 (HTTP WordPress)
# ├── Apache  → :8444 (HTTPS WordPress，直连备用)
# └── frps    → :8082 (FRP 隧道到 N100 campuslink:3002)
#
# ── 以下配置作为归档参考 ──

upstream campuslink_backend {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name jhcaishui.cn 8.156.64.189;

    ssl_certificate /etc/letsencrypt/live/jhcaishui.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jhcaishui.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # CampusLink
    location /campus/ {
        client_max_body_size 20m;
        proxy_pass http://campuslink_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host jhcaishui.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        location ~ \.(html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    location /campus/uploads/ {
        alias /home/ubuntu/app/campuslink/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /campus/assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # WordPress
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host jhcaishui.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# HTTP
server {
    listen 80;
    server_name jhcaishui.cn 8.156.64.189;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host jhcaishui.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
