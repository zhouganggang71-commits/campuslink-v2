# CampusLink — Nginx 反代配置
# 部署路径：/etc/nginx/sites-available/campuslink
# 上游：FRP 隧道到内网 N100（127.0.0.1:3002）

upstream campuslink_backend {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 8443 ssl http2;
    server_name jhcaishui.cn;

    # ── gzip 压缩 ──
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # SSL（实际证书路径请按部署环境配置）
    ssl_certificate     /etc/nginx/ssl/jhcaishui.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/jhcaishui.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态文件
    root /home/ubuntu/app/campuslink/dist;
    index index.html;

    # API 反向代理
    location /campus/ {
        proxy_pass http://campuslink_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # 上传文件缓存
    location /campus/uploads/ {
        alias /home/ubuntu/app/campuslink/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存
    location /campus/assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
